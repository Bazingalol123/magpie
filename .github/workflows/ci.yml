name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Deno tests + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: "deno install (populate node_modules for npm: specifiers)"
        run: deno install

      - name: deno test
        run: deno test --allow-env --allow-read tests

      - name: deno check (every function entry.ts)
        run: deno check $(find base44/functions -name entry.ts)

  frontend-extension:
    name: Extension checks + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: node --check on every extension script
        run: |
          find extension -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: forbid @base44/sdk in the extension
        run: |
          if grep -rn "@base44/sdk" extension; then
            echo "::error::extension files must not import @base44/sdk (see CLAUDE.md architecture boundary)"
            exit 1
          fi

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build
