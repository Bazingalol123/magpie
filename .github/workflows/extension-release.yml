name: Extension Release

on:
  push:
    tags:
      - "extension-v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#extension-v}"
          MANIFEST_VERSION="$(node -p "require('./extension/manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag extension-v$TAG_VERSION does not match extension/manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"

      - name: node --check on every extension script
        run: |
          find extension -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: forbid @base44/sdk in the extension
        run: |
          if grep -rn "@base44/sdk" extension; then
            echo "::error::extension files must not import @base44/sdk (see CLAUDE.md architecture boundary)"
            exit 1
          fi

      - name: Zip extension folder
        run: zip -r "magpie-extension-v${RELEASE_VERSION}.zip" extension

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Magpie extension v${{ env.RELEASE_VERSION }}"
          files: magpie-extension-v${{ env.RELEASE_VERSION }}.zip
          generate_release_notes: true
